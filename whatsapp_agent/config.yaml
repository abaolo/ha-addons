name: WhatsApp Agent
version: "0.2.0"
slug: whatsapp_agent
description: Claude-agentti WhatsAppissa (linkitetty laite) – pääsy Home Assistantiin, kalentereihin ja tiedostoihin
url: https://github.com/abaolo/ha-addons/tree/main/whatsapp_agent
arch:
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
map:
  - type: share
    read_only: false
options:
  anthropic_api_key: ""
  model: claude-sonnet-5-5
  allowed_numbers: []
schema:
  anthropic_api_key: password
  model: str
  allowed_numbers:
    - match(^[0-9]{6,15}$)
